name: Release Build

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build mod
        run: ./gradlew build
      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/libs/*.jar
