name: Build and Release Mirda Mod

on:
  push:
    branches: [ main, claude/** ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mirda-mod-jar
        path: build/libs/*.jar
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: build/libs/*.jar
        generate_release_notes: true
        body: |
          ## Mirda Boss Mod Release

          ### Installation
          1. Download the JAR file below
          2. Place it in your Minecraft `mods` folder
          3. Make sure you have NeoForge 47.1.106 installed for Minecraft 1.20.1
          4. Launch Minecraft and enjoy!

          ### Features
          - Mirda boss entity with multiple phases
          - Custom model and animations
          - Massive altar/castle structure
          - Powerful abilities and attacks
          - Summonable minions and healing towers

          ### Commands
          - `/summon_mirda_altar` - Generate Mirda's altar

          See README.md for full feature list and documentation.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-railway:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: mirda-mod-jar
        path: build/libs/

    - name: Install Railway CLI
      run: npm install -g @railway/cli

    - name: Deploy to Railway
      run: railway up
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
